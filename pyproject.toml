[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wghadir"
version = "1.0.0"
description = "Processing chains for the Wadi Ghadir (Eastern Desert, Egypt) CG-6 gravity and ground magnetic survey"
readme = "README.md"
authors = [{ name = "Dr. Mohamed Sobh, LIAG (Leibniz Institute for Applied Geophysics)" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "openpyxl>=3.1", "matplotlib>=3.7", "pillow>=9",
    "rasterio>=1.3", "pyproj>=3.5", "xarray>=2023.1", "verde>=1.8", "harmonica>=0.7", "xrft>=1.0",
    "ppigrf>=2.1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "nbconvert"]
opensource = ["boule>=0.4", "choclo>=0.2", "pygmt>=0.12", "networkx", "pygtide>=0.9"]
modelling = ["pygimli>=1.5", "simpeg>=0.24", "discretize>=0.11"]
report = ["markdown>=3.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["wghadir*"]
